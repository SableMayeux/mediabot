# Portable install. Existing Sable homelab: deploy/compose.homelab.yaml instead.
services:
  data-init:
    build: .
    restart: "no"
    user: "0:0"
    read_only: true
    network_mode: none
    pids_limit: 16
    mem_limit: 64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "mediabot.core.initialize_volume"]
    volumes:
      - mediabot_data:/app/data

  mediabot:
    build: .
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s
    depends_on:
      data-init:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      HOME: /tmp
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env using scripts/setup.py}
      ALLOWED_GUILD_IDS: ${ALLOWED_GUILD_IDS:?Set ALLOWED_GUILD_IDS in .env using scripts/setup.py}
      SEERR_URL: ${SEERR_URL:?Set SEERR_URL in .env using scripts/setup.py}
      SEERR_API_KEY: ${SEERR_API_KEY:?Set SEERR_API_KEY in .env using scripts/setup.py}
    volumes:
      - mediabot_data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - mediabot.core.runtime_health
        - --path
        - /app/data/runtime-health.json
        - --version
        - 2.8.0
        - --max-age
        - "120"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mediabot_data:
