services:
  mediabot:
    build: .
    container_name: mediabot
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      HOME: /tmp

    volumes:
      - ./data:/app/data

    tmpfs:
      - /tmp:size=64m,mode=1777

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -m
        - mediabot.core.runtime_health
        - --path
        - /app/data/runtime-health.json
        - --version
        - 0.9.1
        - --max-age
        - "120"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
