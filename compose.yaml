services:
  mediabot:
    build: .
    container_name: mediabot
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      HOME: /tmp
      LIFE_CAPTURE_PATH: /life-vault/Life/Inbox
      TORRENT_INTAKE_URL: http://torrent-intake:8765
      TORRENT_INTAKE_TOKEN_PATH: /run/secrets/torrent_intake_token

    secrets:
      - torrent_intake_token

    volumes:
      - ./data:/app/data
      - /opt/stacks/life/vault/Life/Inbox:/life-vault/Life/Inbox

    tmpfs:
      - /tmp:size=64m,mode=1777

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -m
        - mediabot.core.runtime_health
        - --path
        - /app/data/runtime-health.json
        - --version
        - 2.1.3
        - --max-age
        - "120"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    networks:
      - default
      - torrent_intake

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  torrent_intake_token:
    file: /opt/stacks/torrent/secrets/torrent_intake_token

networks:
  torrent_intake:
    external: true
    name: dogginator_torrent_intake
