# Existing Sable homelab only. Run from the repository root with:
# docker compose --project-directory . -f deploy/compose.homelab.yaml ...
# This is a complete alternative file, not an overlay for compose.yaml.
services:
  mediabot:
    build: .
    container_name: mediabot
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      HOME: /tmp
      TZ: America/Denver
      EVENT_TIMEZONE: America/Denver
      LIFE_CAPTURE_PATH: /life-vault/Life/Inbox
      TORRENT_INTAKE_URL: http://torrent-intake:8765
      TORRENT_INTAKE_TOKEN_PATH: /run/secrets/torrent_intake_token
      LIFE_GATEWAY_URL: http://life-gateway:8091
      LIFE_GATEWAY_TOKEN_PATH: /run/secrets/life_gateway_token
      LIFE_TIMEZONE: America/Denver
      NEXTCLOUD_PUBLIC_ORIGIN: https://mediaserver.tail9c0ded.ts.net:8443
      LOCAL_AI_URL: http://local-ai-gateway:8080
      LOCAL_AI_TOKEN_PATH: /run/secrets/local_ai_token
      WEB_SEARCH_URL: http://web-search:8080

    secrets:
      - torrent_intake_token
      - life_gateway_token
      - local_ai_token

    volumes:
      - ./data:/app/data
      - /opt/stacks/life/vault/Life/Inbox:/life-vault/Life/Inbox

    tmpfs:
      - /tmp:size=64m,mode=1777

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -m
        - mediabot.core.runtime_health
        - --path
        - /app/data/runtime-health.json
        - --version
        - 2.8.2
        - --max-age
        - "120"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    networks:
      - default
      - torrent_intake
      - life_intake
      - local_ai_frontend
      - web_search_frontend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  torrent_intake_token:
    file: /opt/stacks/torrent/secrets/torrent_intake_token
  life_gateway_token:
    file: /opt/stacks/life-workflows/secrets/life_gateway_token
  local_ai_token:
    file: /opt/stacks/local-ai/secrets/local_ai_token

networks:
  torrent_intake:
    external: true
    name: dogginator_torrent_intake
  life_intake:
    external: true
    name: life_intake
  local_ai_frontend:
    external: true
    name: local-ai_frontend

  web_search_frontend:
    external: true
    name: mediabot_search_frontend
