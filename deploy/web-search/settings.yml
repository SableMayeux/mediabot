use_default_settings:
  engines:
    keep_only: [duckduckgo, brave, google]
general:
  debug: false
  instance_name: MediaBot private search
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: en-US
  max_page: 1
  formats: [html, json]
server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: POST
outgoing:
  request_timeout: 6.0
  max_request_timeout: 8.0
  pool_connections: 20
