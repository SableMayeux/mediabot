name: local-ai
services:
  ollama:
    image: ollama/ollama@sha256:aa6f86f01fee264c81f1edd9083ebfb07c8116d95d8bedd1ad470874b66a40b4
    container_name: local-ai-ollama
    labels:
      io.sable.local-ai.runtime: "1"
    profiles: [candidate]
    restart: "no"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 6.0
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NOPRUNE: "true"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_GPU_OVERHEAD: "4294967296"
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_LOAD_TIMEOUT: 45s
      OLLAMA_VULKAN: "false"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: ${LOCAL_AI_ROOT:?Set LOCAL_AI_ROOT to the reviewed local-disk staging directory}/models
        target: /models
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [private]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  gateway:
    image: python@sha256:3121f8b0804aa3698ab750d9a39ea4a42657a385c9b133722b915e55c51551a6
    container_name: local-ai-gateway
    profiles: [candidate]
    restart: "no"
    command: [python3, -B, /app/gateway.py]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=8m"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      GPU_STATE: /gpu-state/status.json
      TOKEN_FILE: /run/secrets/local_ai_token
      DESKTOP_AI_URL: ${DESKTOP_AI_URL:-}
      DESKTOP_AI_TOKEN_FILE: /run/secrets/desktop_ai_token
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json,urllib.request;from pathlib import Path;
          token=Path('/run/secrets/local_ai_token').read_text().strip();
          req=urllib.request.Request('http://127.0.0.1:8080/v1/health',headers={'Authorization':'Bearer '+token});
          response=urllib.request.urlopen(req,timeout=2);data=json.load(response);
          assert response.status==200 and type(data.get('ready')) is bool and data.get('model')=='llama3.2:3b-instruct-q4_K_M'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports: ["127.0.0.1:11888:8080"]
    volumes:
      - type: bind
        source: ${LOCAL_AI_ROOT:?Set LOCAL_AI_ROOT}/app
        target: /app
        read_only: true
      - type: bind
        source: ${LOCAL_AI_ROOT:?Set LOCAL_AI_ROOT}/gpu-state
        target: /gpu-state
        read_only: true
      - type: bind
        source: ${LOCAL_AI_ROOT:?Set LOCAL_AI_ROOT}/secrets/local_ai_token
        target: /run/secrets/local_ai_token
        read_only: true
      - type: bind
        source: ${LOCAL_AI_ROOT:?Set LOCAL_AI_ROOT}/secrets/desktop_ai_token
        target: /run/secrets/desktop_ai_token
        read_only: true
    networks: [private, frontend]
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
networks:
  frontend: {}
  private:
    internal: true